<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:;">
  <title>Scan to EPUB</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">SCAN → REFLOW</p>
      <h1>Scan to EPUB</h1>
    </div>
    <p class="tagline">스캔 페이지를 복제하지 않고, 읽히는 전자책으로 재구성합니다.</p>
  </header>

  <main>
    <aside class="controls" aria-label="변환 설정">
      <section class="panel">
        <h2>1. 스캔 PDF</h2>
        <label class="file-drop">
          <input id="pdf-input" type="file" accept="application/pdf,.pdf">
          <span id="file-label">PDF 선택</span>
          <small>깔끔한 파괴식 스캔본을 권장합니다.</small>
        </label>
        <p id="pdf-summary" class="muted">아직 선택된 파일이 없습니다.</p>
        <div class="field-row">
          <label>시작
            <input id="range-start" type="number" min="1" value="1">
          </label>
          <label>끝
            <input id="range-end" type="number" min="1" value="1">
          </label>
        </div>
      </section>

      <section class="panel">
        <h2>2. 멀티모달 API</h2>
        <label>OpenAI 호환 주소
          <input id="base-url" type="url" value="https://api.openai.com/v1" spellcheck="false">
        </label>
        <label>모델
          <input id="model" type="text" placeholder="멀티모달 모델 이름" spellcheck="false">
        </label>
        <label>API 키
          <input id="api-key" type="password" placeholder="로컬 서버라면 비워도 됩니다" autocomplete="off">
        </label>
      </section>

      <section class="panel">
        <h2>3. 책 정보</h2>
        <label>제목
          <input id="book-title" type="text">
        </label>
        <label>저자
          <input id="book-author" type="text">
        </label>
        <label>언어
          <input id="book-language" type="text" value="ko" maxlength="16">
        </label>
        <label class="check">
          <input id="use-cover" type="checkbox" checked>
          첫 스캔 페이지를 표지로 사용
        </label>
      </section>

      <div class="actions">
        <button id="analyze" class="primary" disabled>페이지 분석</button>
        <button id="cancel" class="secondary" disabled>중지</button>
        <button id="export" class="secondary" disabled>EPUB 저장</button>
      </div>

      <div class="progress-wrap" aria-live="polite">
        <div class="progress-track"><div id="progress-bar"></div></div>
        <p id="status">PDF를 선택하세요.</p>
      </div>
    </aside>

    <section class="workspace" aria-label="페이지 분석 결과">
      <div class="workspace-head">
        <div>
          <p class="eyebrow">RECONSTRUCTION</p>
          <h2>변환 결과</h2>
        </div>
        <span id="result-count" class="count">0개 분석됨</span>
      </div>
      <div id="empty-state" class="empty-state">
        <div class="empty-mark">Aa</div>
        <h3>원본 페이지 경계는 여기서 사라집니다.</h3>
        <p>일반 페이지는 연속 텍스트가 되고, 디자인 보존이 필요한 페이지만 이미지 한 장으로 남습니다.</p>
      </div>
      <div id="results" class="results"></div>
    </section>
  </main>

  <div id="toast" role="status"></div>
  <script src="../node_modules/jszip/dist/jszip.min.js"></script>
  <script type="module" src="renderer.mjs"></script>
</body>
</html>
